services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
      - type: volume
        source: npm_cache
        target: /home/node/.npm
      - type: volume
        source: vite_cache
        target: /app/node_modules/.vite
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      WATCHPACK_POLLING: "true"
      VITE_PORT: "5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--strictPort"]
    working_dir: /app
    stdin_open: true
    tty: true

volumes:
  node_modules:
  npm_cache:
  vite_cache: